# agentsh server config for SSSF's local agents. Root-owned, read by the
# agentsh service and by `agentsh wrap`.
server:
  http:
    addr: "127.0.0.1:18080"
  unix_socket:
    enabled: true
    # /run/agentsh is writable only by the agentsh user, so an agent
    # cannot put its own server here.
    path: "/run/agentsh/agentsh.sock"
    permissions: "0666"
auth:
  # Upstream finding #29 is open: any local process can use this API.
  type: "none"
audit:
  enabled: true
  output: "/var/lib/agentsh/audit.jsonl"
  # agentsh rotates this log by size only: at max_size_mb it renames it to .1, shifts
  # .1 to .2 and so on, and overwrites the last of max_backups. max_age_days and
  # compress parse but do nothing in this build. At most 6 files of about 200 MB,
  # 1.2 GB; the prune deletes rotated files older than 2 hours. The store grew
  # 1.4 GB an hour at the rollout and 3.3 GB an hour with chains back to back
  # (2026-11-11), so 2 hours plus up to an hour before the next prune levels off
  # at about 2.8 to 4.2 GB, and 6.6 to 9.9 GB at the peak. With the audit log's
  # 1.2 GB cap that stays under the 15 GB note. See config.md, "The event store".
  rotation:
    max_size_mb: 200
    max_backups: 5
  storage:
    sqlite_path: "/var/lib/agentsh/events.db"
    # agentsh drops an event when this queue is full (default 4096, batches of 64 every
    # 50 ms); a burst at an agent's start filled it on 2026-11-11. An estimated 2 KB an
    # event, so a full queue holds about 32 MB. See config.md, "The event store".
    channel_size: 16384
    batch_size: 256
sessions:
  base_dir: "/var/lib/agentsh/sessions"
sandbox:
  # The seccomp wrapper cannot install under WSL's PID 1 listener.
  unix_sockets:
    enabled: false
  fuse:
    enabled: false
  # The per-session CONNECT proxy. wrap sets HTTPS_PROXY to it, and it
  # checks the CONNECT host against the domain rules. The patched build
  # allows a connect to the session's own proxy, and checks that each
  # tunnel's TLS SNI is its CONNECT host.
  network:
    enabled: true
    require_sni_match: true
  ptrace:
    enabled: true
    attach_mode: "children"
    trace:
      execve: true
      file: true
      network: true
      signal: true
    on_attach_failure: "fail_closed"
proxy:
  mode: disabled
dlp:
  mode: disabled
policies:
  dir: "/etc/agentsh/policies"
  # agentsh_install.py fills these in: SSSF's generated policies, one per repo and harness.
  # SSSF refuses to start without detect_project_root false.
  detect_project_root: false
  default: ""
  # Since upstream 6cb6c7d a session may load only a listed policy, so an
  # agent can't pick a looser one.
  allowed: []
