# This repo's SSSF rules. Commit this file: every clone and every machine
# follows it. Yours to edit. Like every stamped file, an update replaces it only
# while this repo has not changed it, and lists it for review once you have.

# How `just merge` lands a --worktree run:
#   any      fast-forward when it can, a merge commit when the branch moved on
#   ff_only  fast-forward only: refuse when the branch moved on, change nothing
# One machine can override it with SSSF_MERGE_FF_ONLY in .env (1 on, 0 off).
merge: any

# How many --worktree runs may be alive at once. Raise it only if quality.py is
# safe to run twice at the same moment: no fixed port, temp path, or shared
# database. 1 means one at a time.
max_worktree_runs: 2

# What every live run in the repo may spend together, in dollars, checked
# before each agent call and at launch. Each run counts only its current
# attempt, and a call in flight counts once it ends. Off unless set.
#   max_live_cost: 7.50

# What the repo's runs may spend in the last 24 hours, rolling, in dollars,
# finished runs included. Checked before each agent call and at launch; a stop
# says when enough spend ages out to go under it. Off unless set.
#   max_daily_cost: 20.00

# What a fresh checkout needs before the checks can run, such as the untracked
# dependencies a worktree run's folder starts without. Shell commands, run in
# order from the worktree's root before its first agent. A Python repo on uv
# needs none: uv builds each worktree its own environment.
#   worktree_setup:
#     - bun install --frozen-lockfile
#     - cd web && bun install --frozen-lockfile
worktree_setup: []
# Seconds each setup command may take before the run stops.
worktree_setup_timeout: 600
# Rules every agent gets at the end of its system prompt, whatever its role.
# For what this repo needs from every agent, such as a command none may run.
# A rule here asks; it is not enforced. What an agent may change is enforced
# by `writes` and `protected_files` in the roster.
#   agent_rules:
#     - Never run `just deploy`: it spends real money outside SSSF's caps.
agent_rules: []
