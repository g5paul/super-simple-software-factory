# This repo's SSSF rules. Commit this file: every clone and every machine
# follows it. Yours to edit. Like every stamped file, an update replaces it only
# while this repo has not changed it, and lists it for review once you have.

# How `just merge` lands a --worktree run:
#   any      fast-forward when it can, a merge commit when the branch moved on
#   ff_only  fast-forward only: refuse when the branch moved on, change nothing
# One machine can override it with SSSF_MERGE_FF_ONLY in .env (1 on, 0 off).
merge: any

# How many --worktree runs may be alive at once. Raise it only if quality.py is
# safe to run twice at the same moment: no fixed port, temp path, or shared
# database. 1 means one at a time.
# One at a time: the suite's process-kill tests are timing-sensitive, and one
# flaked once on a quiet machine during the install.
max_worktree_runs: 1

# Where a run does its work when it takes --sandbox (the SDLC chains,
# tickets and trials) and the flag is left out: none on this machine,
# openshell for a local microVM, or a remote VM from vercel or e2b. It
# picks for new runs only; a resume stays where its run started.
# `--sandbox none` keeps one run here, and `--sandbox <provider>` picks
# another for one run.
# docs/designs/remote-sandboxes.md in the SSSF repo says what each one needs.
sandbox: none

# What every live run in the repo may spend together, in dollars, checked
# before each agent call and at launch. Each run counts only its current
# attempt, and a call in flight counts once it ends. Off unless set.
#   max_live_cost: 7.50

# What the repo's runs may spend in the last 24 hours, rolling, in dollars,
# finished runs included. Checked before each agent call and at launch; a stop
# says when enough spend ages out to go under it. Off unless set.
#   max_daily_cost: 20.00

# Minutes an agent may go without writing anything before SSSF stops it and
# the run. A live agent streams as it works; one that hangs, say on a server
# started in the foreground, goes quiet and spends nothing, so no cost cap
# catches it. On at 15 unless set: a Claude Code Bash call can take 10 quiet
# minutes, so keep it above that. Raise it if agents run longer quiet
# commands; null turns it off.
#   max_silence_minutes: 15

# What a fresh checkout needs before the checks can run, such as the untracked
# dependencies a worktree run's folder starts without. Shell commands, run in
# order from the worktree's root before its first agent. A Python repo on uv
# needs none: uv builds each worktree its own environment.
#   worktree_setup:
#     - bun install --frozen-lockfile
#     - cd web && bun install --frozen-lockfile
# The hub checks the dashboard's types with its own vue-tsc; a worktree starts without it,
# and npx then finds another TypeScript that can't see bun's or vite's types.
worktree_setup:
  - cd .claude/skills/sssf/apps/visualizer && bun install --frozen-lockfile
# Seconds each setup command may take before the run stops.
worktree_setup_timeout: 600
# In a fork: the repo's own checks, run by `just export` on the branch it builds
# for upstream. The hub isn't a fork of anything it sends SSSF-free work to, so
# it has none.
export_checks: []
# Rules every agent gets at the end of its system prompt, whatever its role.
# A plain string only asks. A rule with `forbid` is also enforced: its regexes
# are searched in every shell command an agent runs, and a match kills the
# agent and stops the run. The command may have started first, so forbid what
# must not happen, and still say it in the rule. `on_match: refuse` refuses
# the command before it runs and lets the run go on, on Claude Code and pi
# agents alike.
#   agent_rules:
#     - Keep commit subjects under 72 characters.
#     - rule: Never run `just deploy`. It spends real money outside SSSF's caps.
#       forbid: ['\bjust\s+deploy\b']
#     - rule: Never run `git push`. Commit locally only.
#       forbid: ['\bgit\b(\s+-[cC]\s+\S+|\s+--?[\w-]+(=\S+)?)*\s+push\b']
#       on_match: refuse
# The hub's push rules: the engineer runs every push, and nothing goes to
# disler. Same patterns as the other projects' refuse rule.
agent_rules:
  - rule: Never run `git push`, `gh pr create`, or any other command that writes to GitHub. Commit locally only.
    on_match: refuse
    forbid:
      - '\bgit\b(\s+-[cC]\s+\S+|\s+--?[\w-]+(=\S+)?)*\s+push\b'
      - '\bgh\s+(pr\s+(create|merge|close|edit|comment|review|reopen|ready)|issue\s+(create|close|edit|comment|delete|reopen|transfer)|release\s+(create|edit|delete|upload)|repo\s+(create|delete|edit|fork|rename|sync|archive)|gist\s+create|workflow\s+run|secret\s+set|variable\s+set|api)\b'
# Rollout step 3 of docs/designs/agentsh-local-sandbox.md: the hub's own agents run
# under the agentsh service. The install comes from the separate clone ~/github/sssf-install:
#   uv run --directory ~/github/sssf-install .claude/skills/sssf/scripts/agentsh_install.py --repo <this checkout>
local_guard: agentsh
