# sssf.config.yaml — the factory's agent roster, Claude Code edition.
# Stamped by `install.py --coding-agent claude_code`. Every agent runs on the
# `claude` CLI under your subscription login: no API key, and .env does not
# need one. Same prompts, purposes, and write boundaries as the Pi roster;
# only the harness and the models differ. See references/config.md.
defaults:
  coding_agent: claude_code
  model: anthropic/claude-sonnet-5-5   # anthropic/* only; the provider prefix is stripped for claude
  thinking: medium                     # maps to --effort: off|minimal -> low, else the same name
  harness_engineering: []              # pi extensions; claude_code cannot load them, keep empty
  # Pi names map to Claude Code tools: read->Read, bash->Bash, edit->Edit,
  # write->Write, grep->Grep, find->Glob, ls->Glob. Claude Code names
  # (e.g. WebFetch) pass through as written.
  tools:
    - read
    - bash
    - edit
    - write
    - grep
    - find
  # Off-limits to every agent that does not name them in its own `writes`.
  # Enforced in adw_modules/permissions.py after each call, the same as on Pi:
  # --permission-mode bypassPermissions lets claude act, and this check decides
  # whether what it did stands.
  # SSSF always protects its own factory files too: all of adws/ (except the runtime under
  # data_dir), all of .claude/, .pi/, .mcp.json, justfile, sssf.just, local.just and .githooks/.
  # A roster can't drop them; only an agent's own `writes` naming one unlocks it. Gitignored
  # files are never checked. The hub's product is the skill under .claude/skills/sssf/, so the
  # builder and ticket_builder name it below.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
    # The hub's own rules and records: the bypass reviewer's brief, the
    # session instructions, and the project list.
    - .claude/agents/
    - CLAUDE.md
    - CLAUDE.local.md
    - docs/projects.md
    - adws/tests/
    # The spec is on record once commit_plan lands. Only the planner, which
    # names specs/ in its writes, may change it.
    - specs/
    # mattpocock/skills' interactive steps own these. The feature folder holds
    # the approved spec and tickets, and only the engineer changes the domain
    # language and the decisions. adw_tickets marks a ticket done in code.
    - .scratch/
    - GLOSSARY.md
    - GLOSSARY-MAP.md
    - docs/adr/
  rate_limit_stop: 0.8                 # stop before an agent starts once a usage window (5-hour, where the plan has one, or 7-day) is this full, and stop any call once the account moves onto usage credits; null = off for both
  # Hub: a guard run makes up to three Opus bypass reviews at up to $5 each, and from 2026-11-13
  # its planner is Fable at up to $4 a call, so the cap went from $20 to $30.
  max_run_cost: 30.00                  # stop before any send once the run has spent this many estimated dollars; null = off
  data_dir: adws/adw_data              # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/adw_data/sssf.db
  poll_ms: 500

agents:
  - name: planner
    model: anthropic/claude-fable-5-2  # the plan sets the ceiling for everything after it
    max_call_cost: 4.00                # one call stops itself here (claude --max-budget-usd); about twice the most one has cost
    thinking: high
    color: "#a78bfa"
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    writes:
      - specs/
    tools:                             # recon + write for the spec; no edit
      - read
      - grep
      - find
      - bash
      - write

  - name: builder
    max_call_cost: 1.50
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # `**` is everything outside defaults.protected_files and SSSF's factory files.
    # The hub's product is the skill, which is under the factory path .claude/, so
    # the builder names it to unlock it. Nothing else under .claude/ is unlocked.
    writes:
      - "**"
      - .claude/skills/sssf/
    tools:
      - read
      - grep
      - find
      - bash
      - edit
      - write

  - name: scout
    model: anthropic/claude-haiku-5-5  # search and report; speed over depth
    max_call_cost: 0.10
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - bash
      - write

  - name: reviewer
    model: anthropic/claude-fable-5-2  # a different model from the builder, so it does not share its blind spots
    max_call_cost: 2.00
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - bash
      - write

  - name: ticket_builder
    max_call_cost: 1.50
    color: "#38bdf8"
    purpose: Build one ticket test-first at the spec's seams; report every changed file.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/ticket_builder/system.md
      user: adws/adw_data/prompt_engineering/ticket_builder/user.md
    # Like builder: everything outside protected_files and the factory files, so
    # it cannot edit the ticket it is building or the spec it is judged against,
    # plus the skill, which it names to unlock.
    writes:
      - "**"
      - .claude/skills/sssf/
    tools:
      - read
      - grep
      - find
      - bash
      - edit
      - write

  - name: standards_reviewer
    model: anthropic/claude-fable-5-2
    max_call_cost: 2.00
    thinking: high
    color: "#f97316"
    purpose: Check a feature's diff against the repo's documented standards and a code smell baseline; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/standards_reviewer/system.md
      user: adws/adw_data/prompt_engineering/standards_reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - bash
      - write

  - name: spec_reviewer
    model: anthropic/claude-fable-5-2
    max_call_cost: 2.00
    thinking: high
    color: "#f43f5e"
    purpose: Check a feature's diff against its spec and tickets; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/spec_reviewer/system.md
      user: adws/adw_data/prompt_engineering/spec_reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - bash
      - write

  # Hub only: the guard-change chain, adws/adw_guard_change.py.
  - name: guard_spec_reviewer
    model: anthropic/claude-opus-5-5
    max_call_cost: 2.00
    thinking: high
    color: "#fb7185"
    purpose: Check a guard change's spec before any code; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/guard_spec_reviewer/system.md
      user: adws/adw_data/prompt_engineering/guard_spec_reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - bash
      - write

  # Hub only. Everything it writes goes under its scratch folder in
  # context_handoff/, which every agent may write.
  - name: bypass_reviewer
    model: anthropic/claude-opus-5-5
    max_call_cost: 5.00
    thinking: high
    color: "#dc2626"
    purpose: Hunt bypasses and harms in a guard change against its spec; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/bypass_reviewer/system.md
      user: adws/adw_data/prompt_engineering/bypass_reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - bash
      - write

  - name: documenter
    model: anthropic/claude-haiku-5-5
    max_call_cost: 0.25
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:
      - app_docs/
      - docs/
      - "**/*.md"
      - "*.md"
      # The skill's own docs, under the factory path .claude/, which **/*.md doesn't unlock.
      - .claude/skills/sssf/SKILL.md
      - .claude/skills/sssf/references/
      - .claude/skills/sssf/cookbooks/
    tools:
      - read
      - grep
      - find
      - bash
      - write
      - edit
