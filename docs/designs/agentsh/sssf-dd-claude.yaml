version: 1
name: sssf-dd-claude
description: SSSF default-deny test policy for claude
command_rules:
  - name: sssf-no-live-tests
    commands: [just]
    args_patterns: ['(^|\s)test\s+live(\s|$)']
    decision: deny
  - name: sssf-no-gh
    commands: [gh]
    decision: deny
  - name: sssf-no-push
    commands: [git]
    args_patterns: ['(^|\s)push(\s|$)']
    decision: deny
  - name: sssf-allow-rest
    decision: allow
file_rules:
  - name: sssf-env-examples
    paths:
      - '**/.env.example'
      - '**/.env.sample'
    operations: ['*']
    decision: allow
  - name: sssf-secret-files
    paths:
      - '**/.env'
      - '**/.env.*'
    operations: ['*']
    decision: deny
  - name: sssf-credentials
    paths:
      - '${HOME}/.ssh/**'
      - '${HOME}/.aws/**'
      - '${HOME}/.azure/**'
      - '${HOME}/.gnupg/**'
      - '${HOME}/.kube/**'
      - '${HOME}/.docker/**'
      - '${HOME}/.config/gh/**'
      - '${HOME}/.config/gcloud/**'
      - '${HOME}/.config/sssf-sandbox/**'
      - '${HOME}/.git-credentials'
      - '${HOME}/.netrc'
      - '${HOME}/.npmrc'
      - '${HOME}/.pypirc'
      - '${HOME}/.cargo/credentials'
      - '${HOME}/.cargo/credentials.toml'
    operations: ['*']
    decision: deny
  - name: sssf-proc-secrets
    paths:
      - '/proc/*/environ'
      - '/proc/*/mem'
      - '/proc/*/task/*/environ'
      - '/proc/*/task/*/mem'
    operations: ['*']
    decision: deny
  - name: sssf-other-sign-in
    paths:
      - '${HOME}/.pi/agent/auth.json'
    operations: ['*']
    decision: deny
  - name: sssf-agent-config
    paths:
      - '${HOME}/.claude/settings.json'
      - '${HOME}/.claude/settings.local.json'
      - '${HOME}/.claude/CLAUDE.md'
      - '${HOME}/.claude/AGENTS.md'
      - '${HOME}/.claude/skills/**'
      - '${HOME}/.claude/rules/**'
      - '${HOME}/.claude/hooks/**'
      - '${HOME}/.claude/agents/**'
      - '${HOME}/.claude/commands/**'
    operations: ['write', 'create', 'delete', 'rename', 'link', 'symlink', 'mkdir', 'rmdir', 'chmod', 'chown']
    decision: deny
  - name: sssf-git-config
    paths:
      - '/home/gpaul/github/sssf-sandbox/.git/hooks'
      - '/home/gpaul/github/sssf-sandbox/.git/hooks/**'
      - '/home/gpaul/github/sssf-sandbox/.git/config'
      - '/home/gpaul/github/sssf-sandbox/.git/config.lock'
      - '${PROJECT_ROOT}/.git/hooks'
      - '${PROJECT_ROOT}/.git/hooks/**'
      - '${PROJECT_ROOT}/.git/config'
      - '${PROJECT_ROOT}/.git/config.lock'
    operations: ['write', 'create', 'delete', 'rename', 'link', 'symlink', 'mkdir', 'rmdir', 'chmod', 'chown']
    decision: deny
  - name: sssf-workspace
    paths:
      - '${PROJECT_ROOT}'
      - '${PROJECT_ROOT}/**'
    operations: ['*']
    decision: allow
  - name: sssf-git-data
    paths:
      - '/home/gpaul/github/sssf-sandbox/.git'
      - '/home/gpaul/github/sssf-sandbox/.git/**'
    operations: ['*']
    decision: allow
  - name: sssf-main-config
    paths:
      - '/home/gpaul/github/sssf-sandbox'
      - '/home/gpaul/github/sssf-sandbox/.claude'
      - '/home/gpaul/github/sssf-sandbox/.claude/**'
    operations: ['open', 'read', 'stat', 'list', 'readlink', 'access']
    decision: allow
  - name: sssf-temp
    paths:
      - '/tmp'
      - '/tmp/**'
      - '/var/tmp'
      - '/var/tmp/**'
      - '/dev/shm'
      - '/dev/shm/**'
    operations: ['*']
    decision: allow
  - name: sssf-devices
    paths:
      - '/dev/null'
      - '/dev/zero'
      - '/dev/tty'
      - '/dev/ptmx'
      - '/dev/pts/**'
      - '/dev/urandom'
      - '/dev/random'
      - '/dev/fd/**'
      - '/dev/stdin'
      - '/dev/stdout'
      - '/dev/stderr'
    operations: ['*']
    decision: allow
  - name: sssf-fd-leaves
    paths:
      - '/proc/*/fd/*'
      - '/proc/*/task/*/fd/*'
    operations: ['*']
    decision: allow
  - name: sssf-mkdir-parents
    paths:
      - '/'
      - '/home'
      - '/tmp'
      - '/run'
      - '/run/user'
      - '/run/user/*'
      - '${HOME}'
      - '${HOME}/.cache'
      - '${HOME}/.local'
      - '${HOME}/.local/state'
      - '${HOME}/.local/share'
      - '${HOME}/.config'
    operations: ['mkdir']
    decision: allow
  - name: sssf-tool-write
    paths:
      - '${HOME}/.cache/uv'
      - '${HOME}/.cache/uv/**'
      - '${HOME}/.local/share/uv'
      - '${HOME}/.local/share/uv/**'
      - '${HOME}/.npm/**'
      - '${HOME}/.cargo/registry/**'
      - '${HOME}/.cargo/git/**'
    operations: ['*']
    decision: allow
  - name: sssf-agent-write
    paths:
      - '${HOME}/.claude'
      - '${HOME}/.claude/**'
      - '${HOME}/.claude.json'
      - '${HOME}/.claude.json.*'
      - '${HOME}/.cache/claude-cli-nodejs/**'
      - '${HOME}/.local/state/claude/**'
      - '${HOME}/.local/share/claude/**'
      - '/run/user/*/cc-socks'
      - '/run/user/*/cc-socks/**'
    operations: ['*']
    decision: allow
  - name: sssf-agent-read
    paths:
      - '${HOME}/AGENTS.md'
      - '${HOME}/CLAUDE.md'
      - '${HOME}/CLAUDE.local.md'
      - '${HOME}/.config/anthropic'
      - '${HOME}/.config/anthropic/**'
      - '${HOME}/github/skills/**'
      - '${HOME}/github/plugins/**'
      - '/mnt/c/Program Files/ClaudeCode'
      - '/mnt/c/Program Files/ClaudeCode/**'
    operations: ['open', 'read', 'stat', 'list', 'readlink', 'access']
    decision: allow
  - name: sssf-config-search
    paths:
      - '/uv.toml'
      - '/pyproject.toml'
      - '/home/uv.toml'
      - '/home/pyproject.toml'
      - '${HOME}/uv.toml'
      - '${HOME}/pyproject.toml'
    operations: ['open', 'read', 'stat', 'list', 'readlink', 'access']
    decision: allow
  - name: sssf-system-read
    paths:
      - '/usr'
      - '/usr/**'
      - '/lib'
      - '/lib/**'
      - '/lib64'
      - '/lib64/**'
      - '/bin'
      - '/bin/**'
      - '/sbin'
      - '/sbin/**'
      - '/opt'
      - '/opt/**'
      - '/etc'
      - '/etc/**'
      - '/sys'
      - '/sys/**'
      - '/proc'
      - '/proc/**'
      - '/'
      - '/home'
      - '/var'
      - '/run'
      - '/mnt'
    operations: ['open', 'read', 'stat', 'list', 'readlink', 'access']
    decision: allow
  - name: sssf-home-read
    paths:
      - '${HOME}'
      - '${HOME}/.bashrc'
      - '${HOME}/.profile'
      - '${HOME}/.bash_profile'
      - '${HOME}/.bash_login'
      - '${HOME}/.editrc'
      - '${HOME}/.inputrc'
      - '${HOME}/.gitconfig'
      - '${HOME}/.config'
      - '${HOME}/.config/git/**'
      - '${HOME}/.config/uv/**'
      - '${HOME}/.cargo'
      - '${HOME}/.cargo/env'
      - '${HOME}/.cargo/bin/**'
      - '${HOME}/.local'
      - '${HOME}/.local/bin/**'
      - '${HOME}/.nvm/**'
      - '${HOME}/.rustup/**'
    operations: ['open', 'read', 'stat', 'list', 'readlink', 'access']
    decision: allow
  - name: sssf-default-deny
    paths:
      - '/'
      - '/**'
    operations: ['*']
    decision: deny
network_rules:
  # The server's HTTP API, upstream finding #29.
  - name: sssf-no-agentsh-api
    cidrs: ['127.0.0.1/32', '::1/128']
    ports: [18080]
    decision: deny
  # The session proxy needs no rule: the patched build allows it exactly.
  # The model hosts: Claude Code and pi on a ChatGPT subscription.
  - name: sssf-model-hosts
    domains: ['api.anthropic.com', '*.anthropic.com', 'api.openai.com', 'chatgpt.com', '*.chatgpt.com']
    ports: [443]
    decision: allow
  # The login refresh hosts: pi's ChatGPT token and Claude Code's OAuth token.
  - name: sssf-auth-hosts
    domains: ['auth.openai.com', 'platform.claude.com']
    ports: [443]
    decision: allow
  # The package registries.
  - name: sssf-registries
    domains: ['registry.npmjs.org', 'pypi.org', 'files.pythonhosted.org', 'crates.io', 'index.crates.io', 'static.crates.io']
    ports: [443]
    decision: allow
  # Everything else is denied: no match is a deny.
