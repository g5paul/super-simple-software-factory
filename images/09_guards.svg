<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 560" width="1220" height="560" font-family="Inter, system-ui, sans-serif">
<defs><style><![CDATA[ .title{font-weight:700;font-size:30px;fill:#FFFFFF;letter-spacing:-0.5px} .mono{font-family:'JetBrains Mono',ui-monospace,monospace} .nd{font-size:15px;fill:#FFFFFF} .lbl{font-size:12px;fill:#94A3B8} .hd3{font-weight:700;font-size:13px;fill:#FFFFFF} .foot{font-size:14px;fill:#CBD5E1} .warn{font-size:12px;fill:#FCA5A5} ]]></style>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="1220" height="560" rx="14" fill="#0B0F14" stroke="#1B2431"/>
<text class="title" x="610.0" y="50" text-anchor="middle">Where each guard acts</text>
<rect x="30" y="80" width="230" height="250" rx="14" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="6 5"/>
<text class="lbl mono" x="46" y="102" fill="#F87171" style="fill:#F87171">agentsh wrap · when on</text>
<rect x="60" y="160" width="170" height="80" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="145.0" y="195.0" text-anchor="middle">agent</text>
<text class="lbl" x="145.0" y="215.0" text-anchor="middle">Claude Code or pi</text>
<text class="hd3" x="400" y="92" text-anchor="middle">before a command or read</text>
<rect x="300" y="105" width="200" height="95" rx="12" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
<text class="nd" x="400.0" y="137.5" text-anchor="middle">command rules</text>
<text class="lbl" x="400.0" y="157.5" text-anchor="middle">read the command's text</text>
<text class="warn" x="400.0" y="177.5" text-anchor="middle">refused on a match</text>
<rect x="300" y="215" width="200" height="95" rx="12" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
<text class="nd" x="400.0" y="247.5" text-anchor="middle">secret files</text>
<text class="lbl" x="400.0" y="267.5" text-anchor="middle">the Read tool and env</text>
<text class="warn" x="400.0" y="287.5" text-anchor="middle">refused for a listed file</text>
<rect x="560" y="170" width="160" height="60" rx="12" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
<text class="nd" x="640.0" y="205.0" text-anchor="middle">the command runs</text>
<text class="hd3" x="880" y="92" text-anchor="middle">after each phase</text>
<rect x="780" y="105" width="200" height="95" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
<text class="nd" x="880.0" y="137.5" text-anchor="middle">writes check</text>
<text class="lbl" x="880.0" y="157.5" text-anchor="middle">paths the phase may write</text>
<text class="warn" x="880.0" y="177.5" text-anchor="middle">puts back the rest</text>
<rect x="780" y="215" width="200" height="95" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
<text class="nd" x="880.0" y="247.5" text-anchor="middle">git-directory guard</text>
<text class="lbl" x="880.0" y="267.5" text-anchor="middle">anything under .git</text>
<text class="warn" x="880.0" y="287.5" text-anchor="middle">puts it back, stops the run</text>
<text class="hd3" x="1110" y="92" text-anchor="middle">at push</text>
<rect x="1020" y="160" width="180" height="95" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
<text class="nd" x="1110.0" y="192.5" text-anchor="middle">pre-push hook</text>
<text class="lbl" x="1110.0" y="212.5" text-anchor="middle">scans for secrets</text>
<text class="warn" x="1110.0" y="232.5" text-anchor="middle">refuses an agent's push</text>
<path d="M230,185 H296" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M230,215 C265,215 265,262 296,262" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M500,152 C530,152 530,190 556,190" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M720,190 C750,190 750,152 776,152" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M720,210 C750,210 750,262 776,262" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M980,152 C1000,152 1000,195 1016,195" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M980,262 C1000,262 1000,220 1016,220" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M145,330 V420 H640 V234" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ag)"/>
<text class="lbl mono" x="392" y="445" text-anchor="middle">agentsh: each exec, file open and connection, checked at the system call</text>
<text class="foot" x="610.0" y="515" text-anchor="middle">The text checks read what the agent asks for. agentsh sees what actually runs.</text>
</svg>
