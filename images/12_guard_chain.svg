<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, system-ui, sans-serif">
<defs><style><![CDATA[ .title{font-weight:700;font-size:30px;fill:#FFFFFF;letter-spacing:-0.5px} .mono{font-family:'JetBrains Mono',ui-monospace,monospace} .nd{font-size:15px;fill:#FFFFFF} .lbl{font-size:12px;fill:#94A3B8} .hd3{font-weight:700;font-size:13px;fill:#FFFFFF} .foot{font-size:14px;fill:#CBD5E1} .warn{font-size:12px;fill:#FCA5A5} ]]></style>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="1200" height="620" rx="14" fill="#0B0F14" stroke="#1B2431"/>
<text class="title" x="600.0" y="50" text-anchor="middle">The guard-change chain</text>
<rect x="40" y="100" width="240" height="95" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="160.0" y="132.5" text-anchor="middle">planner</text>
<text class="lbl" x="160.0" y="152.5" text-anchor="middle">threat model, baseline,</text>
<text class="lbl" x="160.0" y="172.5" text-anchor="middle">bar, out of scope</text>
<rect x="320" y="100" width="240" height="95" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="440.0" y="132.5" text-anchor="middle">spec reviewer</text>
<text class="lbl" x="440.0" y="152.5" text-anchor="middle">passes the spec</text>
<text class="lbl" x="440.0" y="172.5" text-anchor="middle">before any code</text>
<rect x="600" y="100" width="240" height="95" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="720.0" y="142.5" text-anchor="middle">builder</text>
<text class="lbl" x="720.0" y="162.5" text-anchor="middle">changes the guard</text>
<rect x="880" y="100" width="240" height="95" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
<text class="nd" x="1000.0" y="132.5" text-anchor="middle">verify</text>
<text class="lbl" x="1000.0" y="152.5" text-anchor="middle">the hub suite and</text>
<text class="lbl" x="1000.0" y="172.5" text-anchor="middle">the chain's own tests</text>
<path d="M280,147 H316" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M560,147 H596" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M840,147 H876" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<rect x="880" y="265" width="240" height="100" rx="12" fill="#0F172A" stroke="#F87171" stroke-width="2"/>
<text class="nd" x="1000.0" y="300.0" text-anchor="middle">bypass reviewer</text>
<text class="lbl" x="1000.0" y="320.0" text-anchor="middle">judges a snapshot commit</text>
<text class="lbl" x="1000.0" y="340.0" text-anchor="middle">against the baseline</text>
<path d="M1000,195 V261" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M880,315 H720 V199" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ag)"/>
<text class="lbl mono" x="700" y="290" text-anchor="end">a bypass, a harm or a new</text>
<text class="lbl mono" x="700" y="306" text-anchor="end">false positive: the builder</text>
<text class="lbl mono" x="700" y="322" text-anchor="end">fixes it, at most three rounds</text>
<rect x="880" y="440" width="240" height="95" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
<text class="nd" x="1000.0" y="472.5" text-anchor="middle">passes</text>
<text class="lbl" x="1000.0" y="492.5" text-anchor="middle">commits on the branch;</text>
<text class="lbl" x="1000.0" y="512.5" text-anchor="middle">the engineer merges</text>
<rect x="540" y="440" width="280" height="95" rx="12" fill="#0F172A" stroke="#F87171" stroke-width="2"/>
<text class="nd" x="680.0" y="472.5" text-anchor="middle">stops</text>
<text class="lbl" x="680.0" y="492.5" text-anchor="middle">after three rounds, or a fix</text>
<text class="lbl" x="680.0" y="512.5" text-anchor="middle">that adds a mechanism</text>
<path d="M1000,365 V436" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M960,365 C960,400 680,400 680,436" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<rect x="160" y="440" width="300" height="95" rx="12" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
<text class="nd" x="310.0" y="472.5" text-anchor="middle">guard_report.md</text>
<text class="lbl" x="310.0" y="492.5" text-anchor="middle">every finding, for the engineer;</text>
<text class="lbl" x="310.0" y="512.5" text-anchor="middle">a stopped run's code stays in the tree</text>
<path d="M540,487 H464" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ag)"/>
<text class="foot" x="600.0" y="585" text-anchor="middle">Nothing merges to main on its own.</text>
</svg>
