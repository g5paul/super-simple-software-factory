<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, system-ui, sans-serif">
<defs><style><![CDATA[ .title{font-weight:700;font-size:30px;fill:#FFFFFF;letter-spacing:-0.5px} .mono{font-family:'JetBrains Mono',ui-monospace,monospace} .nd{font-size:15px;fill:#FFFFFF} .lbl{font-size:12px;fill:#94A3B8} .hd3{font-weight:700;font-size:13px;fill:#FFFFFF} .foot{font-size:14px;fill:#CBD5E1} .warn{font-size:12px;fill:#FCA5A5} ]]></style>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E2E8F0"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="0" y="0" width="1200" height="640" rx="14" fill="#0B0F14" stroke="#1B2431"/>
<text class="title" x="600.0" y="50" text-anchor="middle">A feature from tickets</text>
<rect x="40" y="100" width="270" height="105" rx="12" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
<text class="nd mono" x="175.0" y="127.5" text-anchor="middle">.scratch/&lt;feature&gt;/</text>
<text class="lbl mono" x="175.0" y="147.5" text-anchor="middle">spec.md</text>
<text class="lbl mono" x="175.0" y="167.5" text-anchor="middle">issues/01-*.md, 02-*.md</text>
<text class="lbl" x="175.0" y="187.5" text-anchor="middle">committed first</text>
<rect x="370" y="100" width="260" height="105" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
<text class="nd" x="500.0" y="127.5" text-anchor="middle">read</text>
<text class="lbl" x="500.0" y="147.5" text-anchor="middle">checks the folder, orders</text>
<text class="lbl" x="500.0" y="167.5" text-anchor="middle">the tickets, refuses before</text>
<text class="lbl" x="500.0" y="187.5" text-anchor="middle">any agent spends</text>
<rect x="690" y="100" width="230" height="105" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="805.0" y="137.5" text-anchor="middle">scout</text>
<text class="lbl" x="805.0" y="157.5" text-anchor="middle">explores once</text>
<text class="lbl" x="805.0" y="177.5" text-anchor="middle">for the whole feature</text>
<path d="M310,152 H366" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M630,152 H686" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<rect x="40" y="250" width="1120" height="170" rx="14" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="6 5"/>
<text class="lbl mono" x="56" y="272" fill="#F59E0B" style="fill:#F59E0B">for each ticket, in order</text>
<rect x="80" y="290" width="280" height="80" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="220.0" y="325.0" text-anchor="middle">build test-first</text>
<text class="lbl" x="220.0" y="345.0" text-anchor="middle">a fresh builder per ticket</text>
<rect x="460" y="290" width="280" height="80" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
<text class="nd" x="600.0" y="325.0" text-anchor="middle">verify</text>
<text class="lbl" x="600.0" y="345.0" text-anchor="middle">the suite and every quality check</text>
<rect x="840" y="290" width="280" height="80" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
<text class="nd" x="980.0" y="325.0" text-anchor="middle">commit</text>
<text class="lbl" x="980.0" y="345.0" text-anchor="middle">the ticket lands on its own</text>
<path d="M360,330 H456" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M740,330 H836" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M980,370 V398 H220 V374" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ag)"/>
<text class="lbl mono" x="600" y="412" text-anchor="middle">next ticket</text>
<path d="M805,205 V250" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<rect x="40" y="465" width="250" height="75" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="165.0" y="507.5" text-anchor="middle">standards review</text>
<rect x="330" y="465" width="250" height="75" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="455.0" y="507.5" text-anchor="middle">spec review</text>
<rect x="620" y="465" width="250" height="75" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
<text class="nd" x="745.0" y="507.5" text-anchor="middle">documenter</text>
<rect x="910" y="465" width="250" height="75" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
<text class="nd" x="1035.0" y="507.5" text-anchor="middle">just merge &lt;adw_id&gt;</text>
<path d="M165,420 V461" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M290,502 H326" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M580,502 H616" fill="none" stroke="#E2E8F0" stroke-width="1.8" marker-end="url(#aw)"/>
<path d="M870,502 H906" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ag)"/>
<text class="foot" x="600.0" y="595" text-anchor="middle">A rerun skips finished tickets and resumes at the first unfinished one.</text>
</svg>
